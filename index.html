<!DOCTYPE html>
<html lang="ar" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منذر سونيي لصيانة الأجهزة الإلكترونية بصرة عشار شارع الكويت 009647700672695</title>
  <link rel="stylesheet" href="includes/style.css">
  <style>
    /* ===== إعادة تعيين ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080c1a;
      color: #c8d6e5;
      margin: 0;
      padding: 16px 16px 80px 16px; /* مساحة إضافية أسفل للكونسول */
      text-align: center;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    h1 {
      font-size: 64px;
      font-weight: 700;
      margin: 8px 0 4px;
      background: linear-gradient(135deg, #00b4ff 0%, #7b2ffc 50%, #00b4ff 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradShift 5s ease-in-out infinite alternate;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
      line-height: 1.1;
    }

    @keyframes gradShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    h1::after {
      content: '';
      display: block;
      width: 140px;
      height: 2px;
      margin: 8px auto 0;
      background: linear-gradient(90deg, transparent, #00b4ff, #7b2ffc, transparent);
      border-radius: 4px;
      opacity: 0.6;
    }

    h3 {
      color: #6a7a8e;
      font-size: 14px;
      font-weight: 400;
      margin: 0 0 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      opacity: 0.8;
    }

    hr {
      border: 0;
      height: 1px;
      margin: 16px auto;
      width: 80%;
      background: linear-gradient(90deg, transparent, rgba(0, 180, 255, 0.15), rgba(123, 47, 252, 0.15), transparent);
      position: relative;
      z-index: 1;
    }

    .btn-container {
      margin: 16px 0 24px;
      position: relative;
      z-index: 1;
    }

    button {
      background: linear-gradient(135deg, #0055ff, #6b2ffc);
      color: #ffffff;
      border: none;
      padding: 13px 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 40px;
      letter-spacing: 1px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 30px rgba(0, 85, 255, 0.2);
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 40px rgba(0, 85, 255, 0.35);
      background: linear-gradient(135deg, #0066ff, #7b2ffc);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    #kernel-options {
      margin-bottom: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.015);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(0, 180, 255, 0.04);
    }

    input[type="radio"] {
      -webkit-appearance: none;
      appearance: none;
      width: 1.1rem;
      height: 1.1rem;
      border: 2px solid rgba(0, 180, 255, 0.2);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    input[type="radio"]:checked {
      border-color: #00b4ff;
      background: #00b4ff;
      box-shadow: 0 0 16px rgba(0, 180, 255, 0.2);
    }

    input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
    }

    /* ===== صندوق التفعيل التلقائي ===== */
    .autoJb {
      margin-top: 20px;
      padding: 18px 28px;
      background: rgba(0, 180, 255, 0.04);
      border-radius: 16px;
      border: 2px solid rgba(0, 180, 255, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 18px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .autoJb:hover {
      background: rgba(0, 180, 255, 0.07);
      border-color: rgba(0, 180, 255, 0.18);
      box-shadow: 0 0 40px rgba(0, 180, 255, 0.04);
    }

    #autoJbLabel {
      color: #c8d6e5;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 30px rgba(0, 180, 255, 0.1);
    }

    #autoJbLabel:hover {
      color: #00b4ff;
      text-shadow: 0 0 40px rgba(0, 180, 255, 0.2);
    }

    #autoJbInput {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0, 180, 255, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    #autoJbInput:checked {
      background: linear-gradient(135deg, #00b4ff, #7b2ffc);
      border-color: #00b4ff;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.25);
    }

    #autoJbInput:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }

    #autoJbInput:hover {
      border-color: rgba(0, 180, 255, 0.5);
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.08);
    }

    /* ===== تخطيط الصور ===== */
    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: center;
      width: 96%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .media-side {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 0 0 22%;
      min-width: 150px;
    }

    .media-box {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.015);
      border-radius: 14px;
      padding: 10px;
      border: 1px solid rgba(0, 180, 255, 0.06);
      transition: all 0.3s ease;
    }

    .media-box:hover {
      border-color: rgba(0, 180, 255, 0.15);
      background: rgba(255, 255, 255, 0.025);
    }

    .media-box img {
      width: 92%;
      height: auto;
      border-radius: 10px;
      border: 1px solid rgba(0, 180, 255, 0.06);
      transition: all 0.3s ease;
      display: block;
      margin: 0 auto;
    }

    .media-box img:hover {
      border-color: rgba(0, 180, 255, 0.2);
    }

    /* ===== الكونسول - شريط رفيع أسفل الشاشة ===== */
    #console {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9998;
      background: rgba(0, 6, 20, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #00e88a;
      font-size: 12px;
      padding: 8px 20px;
      text-align: left;
      height: 42px;
      overflow-y: auto;
      overflow-x: hidden;
      border-top: 1px solid rgba(0, 255, 170, 0.08);
      box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      line-height: 1.5;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 255, 170, 0.1) transparent;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    #console::-webkit-scrollbar {
      height: 3px;
      width: 3px;
    }

    #console::-webkit-scrollbar-track {
      background: transparent;
    }

    #console::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 170, 0.12);
      border-radius: 8px;
    }

    /* ===== دائرة التحميل ===== */
    .loading-spinner {
      position: fixed;
      bottom: 55px;
      right: 35px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 6, 20, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 18px 10px 14px;
      border-radius: 50px;
      border: 1px solid rgba(0, 180, 255, 0.12);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      animation: fadeInUp 0.7s ease forwards 0.6s;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid rgba(0, 180, 255, 0.06);
      border-top-color: #00b4ff;
      border-right-color: #7b2ffc;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner-text {
      color: #8899bb;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
    }

    .spinner-text span {
      color: #00b4ff;
      font-weight: 700;
      background: linear-gradient(135deg, #00b4ff, #7b2ffc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .spinner-dots::after {
      content: '';
      animation: dots 1.8s steps(4, end) infinite;
      -webkit-text-fill-color: #00b4ff;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
      100% { content: ''; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .mt-2 {
      margin-top: 1.5rem;
    }

    /* ===== حماية الصور ===== */
    .media-box,
    .media-box img,
    .media-side,
    .media-side .media-box,
    .media-side .media-box img {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      transform: none !important;
    }

    img[src*="cat.jpg"],
    img[src*="cat2.jpg"] {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      min-height: 70px;
      min-width: 70px;
    }

    .media-side {
      display: flex !important;
      flex-direction: column !important;
      gap: 20px !important;
      flex: 0 0 22% !important;
      min-width: 150px !important;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 820px) {
      h1 {
        font-size: 44px;
      }
      .media-side {
        flex: 0 0 100% !important;
        flex-direction: row !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
      }
      .media-side .media-box {
        flex: 0 0 45% !important;
        max-width: 200px !important;
      }
      button {
        padding: 11px 30px;
        font-size: 14px;
      }
      .main-layout {
        flex-direction: column;
        align-items: center;
      }
      .autoJb {
        padding: 14px 20px;
        gap: 14px;
      }
      #autoJbLabel {
        font-size: 18px;
      }
      #autoJbInput {
        width: 24px;
        height: 24px;
      }
      .loading-spinner {
        bottom: 50px;
        right: 20px;
        padding: 8px 14px 8px 12px;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border-width: 2.5px;
      }
      .spinner-text {
        font-size: 11px;
      }
      #console {
        height: 36px;
        font-size: 10.5px;
        padding: 6px 16px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 30px;
      }
      h3 {
        font-size: 11px;
        letter-spacing: 1.5px;
      }
      button {
        padding: 10px 22px;
        font-size: 12.5px;
      }
      .media-side .media-box {
        flex: 0 0 100% !important;
        max-width: 250px !important;
      }
      .autoJb {
        padding: 12px 16px;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #autoJbLabel {
        font-size: 16px;
      }
      #autoJbInput {
        width: 22px;
        height: 22px;
      }
      .loading-spinner {
        bottom: 44px;
        right: 14px;
        padding: 6px 12px 6px 10px;
        gap: 8px;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border-width: 2px;
      }
      .spinner-text {
        font-size: 10px;
      }
      #console {
        height: 32px;
        font-size: 9.5px;
        padding: 4px 12px;
      }
    }
  </style>
</head>
<body>

  <h1>منذر سونيي</h1>
  <h3 id="UA">Running on:</h3>

  <hr>

  <div class="btn-container">
    <form id="kernel-options">
      <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
      <label for="netctrl-exploit">NetCtrl</label>
      <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
      <label for="lapse-exploit">Lapse</label>
    </form>
    <button id="jeilbrek">تفعيل التهكير الاعتيادي</button>
    <div class="autoJb">
      <label for="autoJbInput" id="autoJbLabel">تفعيل التهكير التلقائي</label>
      <input class="mt-2" id="autoJbInput" type="checkbox">
    </div>
  </div>

  <div class="main-layout">
    <div class="media-side" id="mediaLeft">
      <div class="media-box">
        <img src="includes/cat.jpg" alt="A cat staring at you" id="cat1">
      </div>
    </div>

    <!-- الجهة الوسطى: مساحة فارغة (الصور على الجوانب) -->
    <div style="flex:1; min-width:50px;"></div>

    <div class="media-side" id="mediaRight">
      <div class="media-box">
        <img src="includes/cat2.jpg" alt="Another cat" id="cat2">
      </div>
    </div>
  </div>

  <!-- ===== الكونسول - شريط رفيع أسفل الشاشة ===== -->
  <pre id="console">Ready. Awaiting execution...</pre>

  <!-- ===== دائرة التحميل ===== -->
  <div class="loading-spinner">
    <div class="spinner"></div>
    <div class="spinner-text">
      <span>Loading</span><span class="spinner-dots"></span>
    </div>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>

  <script>
    (function() {
      function protectImages() {
        var images = document.querySelectorAll('img');
        images.forEach(function(img) {
          img.style.display = 'block';
          img.style.visibility = 'visible';
          img.style.opacity = '1';
        });
        var mediaSides = document.querySelectorAll('.media-side');
        mediaSides.forEach(function(side) {
          side.style.display = 'flex';
          side.style.visibility = 'visible';
          side.style.opacity = '1';
        });
      }
      protectImages();
      var observer = new MutationObserver(function() { protectImages(); });
      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class', 'display', 'visibility', 'opacity']
      });
      setInterval(protectImages, 100);
      console.log('🛡️ حماية الصور مفعلة');
    })();
  </script>
</body>
